<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com"
    crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;   0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&  display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com"
    crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,  wght@0,300..800;1,300..800&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <title>Air</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
  </head>
  <body>
    <header class="header">

      <section class="header__top">
        <button class="header__logo" type="button">
          <img class="header__logo-icon" src="src/images/logo/Air-logo.png"
          alt="Air agency logo">
        </button>
        <button class="header__menu" type="button">
          <img class="header__menu-icon" src="src/images/menu-icon.png"
          alt="Open menu">
        </button>
        <a href="#" class="header__hire-us">Hire us</a>
      </section>

      <section class="header__strategic">
        <h1 class="header__strategic-title">Strategic Agency</h1>
        <p class="header__strategic-text">We believe in the power of bold ideas that can solve business challenges.</p>
        <button class="header__strategic-button">Learn more</button>
      </section>

      <section class="header__intro">
        <div class="header__arrows">
          <button class="header__arrows-arrow arrow--prev" type="button">
            <img class="header__arrows-icon"  src="src/images/slider/black-left.png"
            alt="Previous slide">
          </button>
          <button class="header__arrows-arrow arrow--next" type="button">
            <img class="header__arrows-icon" src="src/images/slider/black-right.png"
            alt="Next slide">
          </button>
        </div>
        <div class="header__intro-description">
          <p class="header__intro-title">INtro</p>
          <p class="header__intro-text">By the same illusion which lifts the horizon.</p>
        </div>
      </section>

    </header>
    <script src="src/scripts/main.js"></script>
  </body>
</html>
